<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
:root {
  --bg: #ffffff;
  --fg: #1c1c1e;
  --marker: #c8c8cd;
  --secondary: #6e6e73;
  --code-bg: #f3f3f5;
  --code-fg: #c71f3a;
  --link: #0066cc;
  --list: #34a89c;
}
* { box-sizing: border-box; }
html, body {
  margin: 0; padding: 0;
  height: 100%; width: 100%;
  background: var(--bg); color: var(--fg);
  font-family: -apple-system, "Helvetica Neue", "Apple SD Gothic Neo", sans-serif;
  font-size: 14px;
  line-height: 1.65;
  -webkit-text-size-adjust: 100%;
}
body { overflow: hidden; height: 100vh; }

#editor-wrap { overflow: auto; height: 100%; }

#editor {
  padding: 28px 36px;
  outline: none;
  white-space: pre-wrap;
  overflow-wrap: break-word;
  caret-color: var(--fg);
  min-height: 100%;
}

#editor .line { line-height: 1.65; min-height: 1.65em; }
#editor .marker { color: var(--marker); }
#editor .secondary { color: var(--secondary); }
#editor .h1 { font-size: 24px; font-weight: 700; }
#editor .h2 { font-size: 20px; font-weight: 700; }
#editor .h3 { font-size: 17px; font-weight: 600; }
#editor .h4 { font-size: 15px; font-weight: 600; }
#editor .h5 { font-size: 14px; font-weight: 600; }
#editor .h6 { font-size: 14px; font-weight: 600; color: var(--secondary); }
#editor .h1, #editor .h2, #editor .h3, #editor .h4 { line-height: 1.3; }
#editor .bold { font-weight: 700; }
#editor .italic { font-style: italic; }
#editor .strike { text-decoration: line-through; color: var(--secondary); }
#editor .code {
  background: var(--code-bg); color: var(--code-fg);
  padding: 1px 5px; border-radius: 4px;
  font-family: ui-monospace, "SF Mono", monospace; font-size: 13px;
}
#editor .codeblock {
  background: var(--code-bg); color: var(--secondary);
  font-family: ui-monospace, "SF Mono", monospace; font-size: 13px;
  padding: 0 8px;
}
#editor .codeblock .marker { color: var(--marker); }
#editor .table-row {
  font-family: ui-monospace, "SF Mono", monospace;
  font-size: 13px;
  color: var(--fg);
  background-color: var(--code-bg);
  padding: 2px 10px;
  letter-spacing: 0.02em;
  line-height: 1.6;
  border-left: 2px solid var(--marker);
}
#editor .table-row .pipe { color: var(--marker); padding: 0 2px; }
#editor .table-block {
  user-select: text;
  -webkit-user-select: text;
}
#editor .md-table-wrap {
  margin: 6px 0;
  overflow-x: auto;
  user-select: text;
  -webkit-user-select: text;
}
#editor table.md-table {
  border-collapse: collapse;
  font-size: 14px;
  line-height: 1.45;
  background: var(--bg);
  border: 1px solid var(--marker);
  border-radius: 4px;
  overflow: hidden;
  user-select: text;
  -webkit-user-select: text;
}
#editor table.md-table th,
#editor table.md-table td {
  user-select: text;
  -webkit-user-select: text;
  cursor: text;
}
#editor table.md-table th,
#editor table.md-table td {
  border: 1px solid var(--marker);
  padding: 6px 12px;
  text-align: left;
  vertical-align: top;
}
#editor table.md-table th {
  background: var(--code-bg);
  font-weight: 600;
  color: var(--fg);
}
#editor table.md-table tbody tr:nth-child(even) td {
  background: rgba(0,0,0,0.018);
}
#editor table.md-table code {
  font-family: ui-monospace, "SF Mono", monospace;
  background: var(--code-bg);
  color: var(--code-fg);
  padding: 1px 4px;
  border-radius: 3px;
  font-size: 12.5px;
}
#editor .link { color: var(--link); text-decoration: underline; }
#editor .blockquote { color: var(--secondary); font-style: italic; }
#editor .list-marker { color: var(--list); font-weight: 600; }
#editor .hr { color: var(--marker); }
#editor .html-tag { color: var(--marker); }
::selection { background: rgba(0,102,204,0.22); }
</style>
</head>
<body>
<div id="editor-wrap">
  <div id="editor" contenteditable="true" spellcheck="false"></div>
</div>
<script src="editor.js"></script>
</body>
</html>
