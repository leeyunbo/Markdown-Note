<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
/* === Bundled fonts === */
@font-face {
  font-family: "Pretendard Variable";
  font-weight: 45 920;
  src: url("vendor/PretendardVariable.woff2") format("woff2-variations");
  font-display: swap;
}
@font-face {
  font-family: "JetBrains Mono";
  src: url("vendor/JetBrainsMono-Regular.woff2") format("woff2");
  font-weight: 400; font-display: swap;
}
@font-face {
  font-family: "JetBrains Mono";
  src: url("vendor/JetBrainsMono-Medium.woff2") format("woff2");
  font-weight: 500; font-display: swap;
}
@font-face {
  font-family: "JetBrains Mono";
  src: url("vendor/JetBrainsMono-SemiBold.woff2") format("woff2");
  font-weight: 600; font-display: swap;
}
@font-face {
  font-family: "Caveat";
  src: url("vendor/Caveat[wght].ttf") format("truetype-variations");
  font-weight: 400 700; font-display: swap;
}
@font-face {
  font-family: "Kalam";
  src: url("vendor/Kalam-Regular.ttf") format("truetype");
  font-weight: 400; font-display: swap;
}
@font-face {
  font-family: "Kalam";
  src: url("vendor/Kalam-Bold.ttf") format("truetype");
  font-weight: 700; font-display: swap;
}

/* === Refract theme tokens === */
/* Default = night. Swift이 documentElement에 data-theme=...을 set하면 해당 블록 활성. */
:root {
  /* fonts */
  --ui-font: -apple-system, "SF Pro Text", "Helvetica Neue", "Apple SD Gothic Neo", sans-serif;
  --mono-font: "JetBrains Mono", ui-monospace, "SF Mono", Menlo, monospace;
  --display-font: "Space Grotesk", -apple-system, sans-serif;
  --body-font: var(--ui-font);
  --head-font: var(--ui-font);
  --fs: 1.0;

  /* night tokens (default) */
  --bg: #0d0e16;
  --rawBg: #0c0d14;
  --renBg: #10121e;
  --ink: #e7e9f6;
  --sub: #9aa0bd;
  --faint: #565d7e;
  --line: rgba(255,255,255,0.06);
  --accent: #8b94ff;
  --accentDim: rgba(139,148,255,0.55);
  --active: rgba(139,148,255,0.07);
  --chipBg: rgba(158,206,106,0.12);
  --chipFg: #9ece6a;
  --link: #82aaff;
  --codeCard: rgba(21,23,36,0.5);

  /* syntax tokens */
  --syn-keyword: #bb9af7;
  --syn-type: #2ac3de;
  --syn-function: #82aaff;
  --syn-string: #9ece6a;
  --syn-number: #ff9e64;
  --syn-comment: #565f89;
  --syn-default: #c7cdf0;
  --syn-punctuation: #7f86a8;

  /* paper ruling (only paper theme) */
  --rule: transparent;
}

:root[data-theme="day"] {
  --bg: #ffffff;
  --rawBg: #fbfbfe;
  --renBg: #ffffff;
  --ink: #1b1d2a;
  --sub: #565b73;
  --faint: #a4a9bd;
  --line: rgba(20,22,40,0.09);
  --accent: #5b5cf0;
  --accentDim: rgba(91,92,240,0.5);
  --active: rgba(91,92,240,0.05);
  --chipBg: #eef6ee;
  --chipFg: #2f9e44;
  --link: #5b5cf0;
  --codeCard: #f7f7fc;
  --syn-keyword: #d6336c;
  --syn-type: #0c8599;
  --syn-function: #6741d9;
  --syn-string: #2f9e44;
  --syn-number: #e8590c;
  --syn-comment: #a4a9bd;
  --syn-default: #3a3f55;
  --syn-punctuation: #7a8096;
}

:root[data-theme="sepia"] {
  --bg: #f4ecd8;
  --rawBg: #efe6cf;
  --renBg: #f7efdc;
  --ink: #3b2f1e;
  --sub: #6b5a40;
  --faint: #a8997c;
  --line: rgba(80,60,30,0.14);
  --accent: #b5651d;
  --accentDim: rgba(181,101,29,0.5);
  --active: rgba(181,101,29,0.06);
  --chipBg: #e8dabb;
  --chipFg: #8a5a2b;
  --link: #9a5b2a;
  --codeCard: #efe4ca;
  --syn-keyword: #a83232;
  --syn-type: #3f7a5f;
  --syn-function: #8a5a2b;
  --syn-string: #5b8a3a;
  --syn-number: #c2701c;
  --syn-comment: #b0a184;
  --syn-default: #4a3c28;
  --syn-punctuation: #8a7a5c;
}

:root[data-theme="forest"] {
  --bg: #0e1714;
  --rawBg: #0c1512;
  --renBg: #101e19;
  --ink: #d8e9df;
  --sub: #8fae9f;
  --faint: #54705f;
  --line: rgba(255,255,255,0.06);
  --accent: #58c896;
  --accentDim: rgba(88,200,150,0.5);
  --active: rgba(88,200,150,0.07);
  --chipBg: rgba(229,192,123,0.12);
  --chipFg: #e5c07b;
  --link: #6fd0a0;
  --codeCard: #0f1c17;
  --syn-keyword: #e394dd;
  --syn-type: #5ccfe6;
  --syn-function: #7ee0b8;
  --syn-string: #c3e88d;
  --syn-number: #ffcb6b;
  --syn-comment: #4a6a59;
  --syn-default: #cfe6da;
  --syn-punctuation: #6f8a7c;
}

/* 손글씨 — PREVIEW만 Kalam/Caveat + ruling 추가, SOURCE는 mono 유지. */
:root[data-theme="paper"] {
  --bg: #fbf7ec;
  --rawBg: #f2ead7;
  --renBg: #fdfaf0;
  --ink: #2b3a55;
  --sub: #566583;
  --faint: #a6abbc;
  --line: rgba(43,58,85,0.13);
  --accent: #d2543e;
  --accentDim: rgba(210,84,62,0.5);
  --active: rgba(210,84,62,0.06);
  --chipBg: #efe6d2;
  --chipFg: #b5701a;
  --link: #2f6fb0;
  --codeCard: #f2ead7;
  --syn-keyword: #c0392b;
  --syn-type: #2f7a4f;
  --syn-function: #2f6fb0;
  --syn-string: #b5701a;
  --syn-number: #2a6a8a;
  --syn-comment: #9a8c6a;
  --syn-default: #3a3f55;
  --syn-punctuation: #7a8096;
  /* paper-specific */
  --body-font: "Kalam", "Comic Sans MS", sans-serif;
  --head-font: "Caveat", "Kalam", cursive;
  --fs: 1.22;
  --rule: rgba(43,58,85,0.10);
}

/* === Refract shell === */
* { box-sizing: border-box; }
html, body {
  margin: 0; padding: 0;
  height: 100%; width: 100%;
  background: var(--bg);
  color: var(--ink);
  font-family: var(--ui-font);
  font-size: 13px;
  -webkit-font-smoothing: antialiased;
}

#refract-shell {
  display: grid;
  grid-template-rows: 46px 1fr;
  height: 100vh;
  overflow: hidden;
  background: var(--bg);
}

/* === Header === */
#refract-header {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 0 16px;
  border-bottom: 1px solid var(--line);
  background: var(--bg);
  /* macOS traffic light 영역 확보 (왼쪽 ~80px) */
  padding-left: 92px;
  -webkit-app-region: drag;
  user-select: none;
}
#refract-header > * { -webkit-app-region: no-drag; }
.r-glyph {
  display: inline-flex;
  align-items: center;
  gap: 3px;
}
.r-glyph .bar {
  width: 3.5px; height: 15px; border-radius: 2px;
}
.r-glyph .bar:nth-child(1) { background: #6366f1; }
.r-glyph .bar:nth-child(2) { background: #0ea5e9; }
.r-glyph .bar:nth-child(3) { background: #10b981; }
.r-glyph .bar:nth-child(4) { background: #f59e0b; }
.r-wordmark {
  font-family: var(--display-font);
  font-size: 16px;
  font-weight: 700;
  letter-spacing: -0.4px;
  color: var(--ink);
}
.r-divider {
  width: 1px; height: 16px;
  background: var(--line);
}
.r-filename {
  font-size: 13px;
  color: var(--sub);
  max-width: 360px;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}
.r-dirty-dot {
  width: 6px; height: 6px;
  border-radius: 50%;
  background: var(--accent);
  display: none;
}
body[data-dirty="1"] .r-dirty-dot { display: inline-block; }
.r-spacer { flex: 1; }
.r-view-toggle {
  display: inline-flex;
  background: var(--rawBg);
  border-radius: 8px;
  padding: 2px;
  border: 1px solid var(--line);
}
.r-view-toggle button {
  background: transparent;
  border: none;
  height: 22px;
  padding: 0 10px;
  border-radius: 6px;
  font-family: var(--ui-font);
  font-size: 12px;
  color: var(--sub);
  cursor: pointer;
}
.r-view-toggle button.active {
  background: var(--bg);
  color: var(--ink);
  box-shadow: 0 1px 2px rgba(0,0,0,0.10);
}
.r-theme-button {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  background: transparent;
  border: 1px solid var(--line);
  border-radius: 8px;
  padding: 4px 10px;
  height: 26px;
  color: var(--sub);
  font-size: 12px;
  cursor: pointer;
  font-family: var(--ui-font);
}
.r-theme-button .swatch {
  width: 14px; height: 14px;
  border-radius: 3px;
  background: var(--accent);
}

/* === Body grid === */
#refract-body {
  position: relative;
  display: grid;
  grid-template-columns: 1fr 1fr;
  height: 100%;
  overflow: hidden;
}
#refract-shell[data-view-mode="source"] #refract-body {
  grid-template-columns: 1fr 0;
}
#refract-shell[data-view-mode="source"] #preview-column,
#refract-shell[data-view-mode="source"] #prism-seam { display: none; }
#refract-shell[data-view-mode="preview"] #refract-body {
  grid-template-columns: 0 1fr;
}
#refract-shell[data-view-mode="preview"] #source-column,
#refract-shell[data-view-mode="preview"] #prism-seam { display: none; }

#source-column, #preview-column {
  position: relative;
  height: 100%;
  overflow: hidden;
  display: flex;
  flex-direction: column;
}
#source-column { background: var(--rawBg); }
#preview-column { background: var(--renBg); }

.r-col-label {
  position: absolute;
  top: 10px;
  left: 16px;
  font-family: var(--mono-font);
  font-size: 10px;
  font-weight: 700;
  letter-spacing: 1.5px;
  color: var(--faint);
  opacity: 0.5;
  text-transform: uppercase;
  pointer-events: none;
  z-index: 5;
}

#editor-host {
  flex: 1;
  overflow: hidden;
}
#preview-host {
  flex: 1;
  overflow: auto;
  padding: 38px 36px 40px;
  font-family: var(--body-font);
  font-size: calc(14px * var(--fs));
  line-height: 1.71;
  color: var(--sub);
  /* paper ruling — paper 테마에서만 ruled 줄 표시 */
  background-image: repeating-linear-gradient(
    to bottom,
    transparent 0,
    transparent calc(1.71em * var(--fs) - 1px),
    var(--rule) calc(1.71em * var(--fs) - 1px),
    var(--rule) calc(1.71em * var(--fs))
  );
}

/* === Prism seam === */
#prism-seam {
  position: absolute;
  top: 14px;
  bottom: 14px;
  left: 50%;
  transform: translateX(-50%);
  width: 3px;
  border-radius: 3px;
  background: linear-gradient(180deg,
    #6366f1 0%, #0ea5e9 16%, #10b981 33%, #f59e0b 50%,
    #ef4444 66%, #ec4899 83%, #8b5cf6 100%);
  box-shadow: 0 0 16px rgba(130,120,255,0.5);
  pointer-events: none;
  z-index: 10;
}
:root[data-theme="day"] #prism-seam,
:root[data-theme="sepia"] #prism-seam,
:root[data-theme="paper"] #prism-seam {
  box-shadow: 0 0 12px rgba(99,102,241,0.35);
}
/* Seam flash — 타이핑 시 0.5s ease-out으로 깜빡임. ink-ripple과 같은 트리거. */
#prism-seam.flash::before {
  content: "";
  position: absolute;
  inset: -1px;
  border-radius: 4px;
  background: inherit;
  filter: blur(4px);
  opacity: 0.95;
  animation: seam-flash 0.5s ease-out forwards;
}
@keyframes seam-flash {
  from { opacity: 0.95; }
  to { opacity: 0; }
}

/* === Ink ripple === */
.ink-ripple {
  position: fixed;
  width: 13px;
  height: 13px;
  border: 1.5px solid var(--accent);
  border-radius: 50%;
  pointer-events: none;
  z-index: 200;
  animation: ink-ripple 0.5s ease-out forwards;
}
@keyframes ink-ripple {
  from { transform: scale(0.3); opacity: 0.6; }
  to   { transform: scale(1.8); opacity: 0; }
}

/* === Reduced motion === */
@media (prefers-reduced-motion: reduce) {
  .ink-ripple, #prism-seam.flash::before { display: none; }
  .cm-cursor { animation: none !important; }
}

/* === SOURCE — CodeMirror === */
.cm-editor {
  height: 100%;
  background: var(--rawBg);
  color: var(--syn-default);
  font-family: var(--mono-font);
  font-size: 12.5px;
  line-height: 22px;
  letter-spacing: -0.2px;
}
.cm-editor.cm-focused {
  outline: none;
}
.cm-content {
  padding: 38px 16px 40px 0;
  caret-color: var(--accent);
}
.cm-scroller {
  font-family: var(--mono-font);
}
.cm-gutters {
  background: var(--rawBg);
  border-right: none;
  color: var(--faint);
  opacity: 0.5;
}
.cm-gutter.cm-lineNumbers .cm-gutterElement {
  padding: 0 8px 0 14px;
  font-size: 11px;
  min-width: 34px;
  text-align: right;
}
.cm-activeLineGutter {
  background: transparent;
  color: var(--accent);
  opacity: 1;
}
.cm-activeLine {
  background: var(--active);
  box-shadow: inset 2px 0 0 var(--accent);
}
.cm-cursor {
  border-left: 2px solid var(--accent);
  border-left-width: 2px;
}
.cm-editor .cm-selectionBackground,
.cm-editor.cm-focused .cm-selectionBackground {
  background: var(--accentDim) !important;
}

/* === SOURCE markdown highlighting === */
/* 마커는 dim, heading text는 ink, 코드는 syn 토큰 */
.cm-content .tok-meta,
.cm-content .cm-md-marker { color: var(--accentDim); }
.cm-content .tok-heading,
.cm-content .tok-heading1,
.cm-content .tok-heading2,
.cm-content .tok-heading3,
.cm-content .tok-heading4,
.cm-content .tok-heading5,
.cm-content .tok-heading6 { color: var(--ink); font-weight: 600; }
.cm-content .tok-strong { color: var(--ink); font-weight: 700; }
.cm-content .tok-emphasis { color: var(--sub); font-style: italic; }
.cm-content .tok-link { color: var(--syn-function); }
.cm-content .tok-url { color: var(--faint); }
.cm-content .tok-monospace,
.cm-content .tok-inlineCode,
.cm-content .cm-inline-code {
  color: var(--syn-string);
  font-family: var(--mono-font);
}
.cm-content .tok-processingInstruction { color: var(--faint); }
.cm-content .tok-quote { color: var(--sub); font-style: italic; }
.cm-content .tok-list,
.cm-content .md-list-mark { color: var(--accent); }
/* 코드 토큰 — fenced code 안 */
.cm-content .tok-keyword { color: var(--syn-keyword); font-weight: 500; }
.cm-content .tok-typeName { color: var(--syn-type); }
.cm-content .tok-string { color: var(--syn-string); }
.cm-content .tok-number { color: var(--syn-number); }
.cm-content .tok-comment { color: var(--syn-comment); font-style: italic; }
.cm-content .tok-operator,
.cm-content .tok-punctuation,
.cm-content .tok-bracket { color: var(--syn-punctuation); }
.cm-content .tok-variableName { color: var(--syn-default); }
.cm-content .tok-className { color: var(--syn-type); }
.cm-content .tok-function { color: var(--syn-function); font-weight: 600; }

/* Search panel — minimal */
.cm-panels.cm-panels-top {
  background: var(--rawBg);
  border-bottom: 1px solid var(--line);
  color: var(--ink);
}
.cm-panel.cm-search {
  padding: 8px 14px;
  display: flex;
  gap: 6px;
  align-items: center;
  font-size: 12px;
}
.cm-search .cm-textfield {
  background: var(--bg);
  color: var(--ink);
  border: 1px solid var(--line);
  border-radius: 5px;
  padding: 3px 9px;
  outline: none;
  min-width: 180px;
  height: 26px;
  font-size: 12px;
}
.cm-search .cm-textfield:focus {
  border-color: var(--accent);
  box-shadow: 0 0 0 3px var(--accentDim);
}
.cm-search .cm-button {
  background: transparent;
  border: 1px solid var(--line);
  border-radius: 5px;
  padding: 3px 10px;
  color: var(--ink);
  font-size: 12px;
  cursor: pointer;
  height: 26px;
}
.cm-search .cm-button:hover { background: var(--active); }
.cm-searchMatch { background: var(--accentDim); border-radius: 2px; }
.cm-searchMatch-selected {
  background: var(--accent);
  color: var(--bg);
}

/* === PREVIEW markdown rendering === */
#preview-host h1 {
  font-family: var(--head-font);
  font-size: calc(25px * var(--fs));
  font-weight: 700;
  letter-spacing: -0.4px;
  line-height: 1.2;
  color: var(--ink);
  margin: 0 0 0.5em;
  position: relative;
}
#preview-host h1::before {
  content: "";
  position: absolute;
  left: -16px;
  top: 0.2em;
  width: 4px;
  height: 0.8em;
  background: var(--accent);
  border-radius: 2px;
}
#preview-host h2 {
  font-family: var(--head-font);
  font-size: calc(18.5px * var(--fs));
  font-weight: 650;
  color: var(--ink);
  margin: 1.2em 0 0.5em;
  position: relative;
}
#preview-host h2::before {
  content: "";
  position: absolute;
  left: -16px;
  top: 0.2em;
  width: 4px;
  height: 0.8em;
  background: var(--accent);
  border-radius: 2px;
}
#preview-host h3 {
  font-family: var(--head-font);
  font-size: calc(15.5px * var(--fs));
  font-weight: 650;
  color: var(--ink);
  margin: 1em 0 0.4em;
}
#preview-host h4 {
  font-family: var(--head-font);
  font-size: calc(14px * var(--fs));
  font-weight: 650;
  color: var(--ink);
  margin: 0.8em 0 0.3em;
}
#preview-host h5 {
  font-family: var(--head-font);
  font-size: calc(12.5px * var(--fs));
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: 0.5px;
  color: var(--sub);
  margin: 0.8em 0 0.3em;
}
#preview-host h6 {
  font-family: var(--head-font);
  font-size: calc(12px * var(--fs));
  font-weight: 600;
  color: var(--faint);
  margin: 0.6em 0 0.2em;
}
#preview-host p {
  margin: 0 0 0.8em;
  font-size: calc(14px * var(--fs));
  line-height: 1.71;
}
#preview-host strong { color: var(--ink); font-weight: 700; }
#preview-host em { font-style: italic; color: var(--sub); }
#preview-host del { color: var(--faint); text-decoration: line-through; }
#preview-host a {
  color: var(--link);
  text-decoration: underline;
  text-decoration-color: color-mix(in srgb, var(--link) 55%, transparent);
  text-underline-offset: 2px;
}
#preview-host ul, #preview-host ol {
  padding-left: 22px;
  margin: 0 0 0.8em;
}
#preview-host ul { list-style: none; }
#preview-host ul li {
  position: relative;
  padding: 0;
  line-height: 25px;
  font-size: calc(14px * var(--fs));
}
#preview-host ul li::before {
  content: "•";
  position: absolute;
  left: -14px;
  color: var(--accent);
  font-weight: 700;
}
#preview-host ul ul li::before {
  content: "◦";
  color: var(--faint);
}
#preview-host ol li {
  font-size: calc(14px * var(--fs));
  line-height: 25px;
}
#preview-host ol li::marker {
  color: var(--accent);
  font-family: var(--mono-font);
}
/* Task list */
#preview-host li.task-list-item {
  list-style: none;
  position: relative;
  padding-left: 22px;
}
#preview-host li.task-list-item::before { content: none; }
#preview-host li.task-list-item input[type="checkbox"] {
  position: absolute;
  left: 0;
  top: 5px;
  margin: 0;
  width: 16px;
  height: 16px;
  appearance: none;
  border: 1.5px solid var(--accent);
  border-radius: 5px;
  cursor: default;
  background: transparent;
}
#preview-host li.task-list-item input[type="checkbox"]:checked {
  background: var(--accent);
}
#preview-host li.task-list-item input[type="checkbox"]:checked::after {
  content: "✓";
  position: absolute;
  top: -2px; left: 1px;
  font-size: 13px;
  color: var(--bg);
  font-weight: 700;
}
#preview-host li.task-list-item.checked {
  color: var(--faint);
  text-decoration: line-through;
}

#preview-host blockquote {
  border-left: 3px solid var(--accent);
  padding-left: 14px;
  margin: 0.8em 0;
  color: var(--sub);
  font-style: italic;
}
#preview-host code {
  font-family: var(--mono-font);
  font-size: 12.5px;
  color: var(--chipFg);
  background: var(--chipBg);
  padding: 1px 6px;
  border-radius: 6px;
}
#preview-host pre {
  background: var(--codeCard);
  border: 1px solid var(--line);
  border-radius: 11px;
  padding: 0;
  overflow: hidden;
  margin: 1em 0;
  position: relative;
}
#preview-host pre > .code-header {
  height: 28px;
  border-bottom: 1px solid var(--line);
  padding: 0 14px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  background: transparent;
}
#preview-host pre > .code-header .lang-chip {
  background: #f05138;
  color: #fff;
  font-family: var(--mono-font);
  font-size: 10px;
  font-weight: 600;
  padding: 2px 7px;
  border-radius: 5px;
}
#preview-host pre > .code-header .copy-label {
  font-family: var(--ui-font);
  font-size: 11px;
  color: var(--faint);
  cursor: pointer;
}
#preview-host pre > .code-header .copy-label:hover { color: var(--ink); }
#preview-host pre code {
  display: grid;
  grid-template-columns: 30px 1fr;
  background: transparent;
  padding: 12px 14px;
  font-size: 12px;
  line-height: 20px;
  border-radius: 0;
}
#preview-host pre code .line-number {
  color: var(--faint);
  text-align: right;
  padding-right: 10px;
  user-select: none;
}
#preview-host pre code .line-content { white-space: pre; }

/* highlight.js token mapping → CSS vars */
#preview-host pre code .hljs-keyword,
#preview-host pre code .hljs-built_in { color: var(--syn-keyword); font-weight: 500; }
#preview-host pre code .hljs-type,
#preview-host pre code .hljs-title.class_ { color: var(--syn-type); }
#preview-host pre code .hljs-string,
#preview-host pre code .hljs-attr { color: var(--syn-string); }
#preview-host pre code .hljs-number,
#preview-host pre code .hljs-literal { color: var(--syn-number); }
#preview-host pre code .hljs-comment,
#preview-host pre code .hljs-meta { color: var(--syn-comment); font-style: italic; }
#preview-host pre code .hljs-title,
#preview-host pre code .hljs-function .hljs-title,
#preview-host pre code .hljs-name { color: var(--syn-function); font-weight: 600; }
#preview-host pre code .hljs-punctuation,
#preview-host pre code .hljs-operator { color: var(--syn-punctuation); }

#preview-host table {
  border-collapse: collapse;
  border: 1px solid var(--line);
  border-radius: 10px;
  overflow: hidden;
  margin: 1em 0;
  width: 100%;
}
#preview-host thead {
  background: color-mix(in srgb, var(--ink) 3%, transparent);
}
#preview-host th, #preview-host td {
  padding: 7px 12px;
  border-bottom: 1px solid var(--line);
  text-align: left;
}
#preview-host th {
  color: var(--ink);
  font-weight: 600;
}
#preview-host td { color: var(--sub); }
#preview-host tr:last-child td { border-bottom: none; }

#preview-host hr {
  border: none;
  height: 1px;
  background: var(--line);
  margin: 1.5em 0;
  position: relative;
}
#preview-host hr::after {
  content: "";
  position: absolute;
  left: 50%;
  top: -2px;
  width: 6px;
  height: 6px;
  border-radius: 50%;
  background: var(--accent);
  transform: translateX(-50%);
}

#preview-host img {
  max-width: 100%;
  height: auto;
  border-radius: 8px;
  margin: 0.8em 0;
}

/* === Counter pill === */
#counter-pill {
  position: fixed;
  bottom: 14px;
  left: 50%;
  transform: translateX(-50%);
  display: inline-flex;
  align-items: center;
  gap: 8px;
  background: var(--rawBg);
  border: 1px solid var(--line);
  border-radius: 18px;
  padding: 5px 14px;
  font-family: var(--ui-font);
  font-size: 12px;
  color: var(--sub);
  z-index: 20;
  user-select: none;
}
#counter-pill .dots {
  display: inline-flex; gap: 3px;
}
#counter-pill .dots .d {
  width: 4px; height: 4px; border-radius: 50%;
}
#counter-pill .dots .d:nth-child(1) { background: #6366f1; }
#counter-pill .dots .d:nth-child(2) { background: #0ea5e9; }
#counter-pill .dots .d:nth-child(3) { background: #f59e0b; }
#counter-pill .dots .d:nth-child(4) { background: #ec4899; }
#counter-pill .dots .d:nth-child(5) { background: #8b5cf6; }
#counter-pill .count { color: var(--ink); font-weight: 600; }
#counter-pill .typing { color: var(--accent); display: none; }
body[data-typing="1"] #counter-pill .typing { display: inline; }

/* === Theme popover === */
#theme-popover {
  position: fixed;
  top: 50px;
  right: 16px;
  width: 210px;
  background: var(--bg);
  border: 1px solid var(--line);
  border-radius: 12px;
  box-shadow: 0 12px 32px rgba(0,0,0,0.32);
  padding: 8px;
  z-index: 100;
  font-family: var(--ui-font);
  display: none;
}
#theme-popover.open { display: block; }
#theme-popover .caption {
  font-family: var(--mono-font);
  font-size: 10px;
  font-weight: 700;
  letter-spacing: 1.5px;
  color: var(--faint);
  padding: 6px 10px;
  text-transform: uppercase;
}
#theme-popover .row {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 6px 10px;
  border-radius: 6px;
  cursor: pointer;
  color: var(--ink);
  font-size: 13px;
}
#theme-popover .row:hover { background: var(--active); }
#theme-popover .row.active { background: var(--active); }
#theme-popover .row .check {
  margin-left: auto;
  color: var(--accent);
  display: none;
  font-weight: 700;
}
#theme-popover .row.active .check { display: inline; }
#theme-popover .row .mini-swatch {
  width: 24px; height: 16px;
  border-radius: 3px;
  background: var(--accent);
  flex-shrink: 0;
}
#theme-popover .row[data-key="paper"] .label { font-family: "Caveat", cursive; font-size: 16px; }
</style>
</head>
<body>
<div id="refract-shell" data-view-mode="split">
  <div id="refract-header">
    <span class="r-glyph">
      <span class="bar"></span>
      <span class="bar"></span>
      <span class="bar"></span>
      <span class="bar"></span>
    </span>
    <span class="r-wordmark">Refract</span>
    <span class="r-divider"></span>
    <span class="r-filename">Untitled</span>
    <span class="r-dirty-dot"></span>
    <span class="r-spacer"></span>
    <div class="r-view-toggle" id="r-view-toggle">
      <button data-mode="source">소스</button>
      <button data-mode="split" class="active">분할</button>
      <button data-mode="preview">미리보기</button>
    </div>
    <button class="r-theme-button" id="r-theme-button">
      <span class="swatch"></span>
      <span class="label">Night</span>
    </button>
  </div>
  <div id="refract-body">
    <div id="source-column">
      <div class="r-col-label">01 — Source</div>
      <div id="editor-host"></div>
    </div>
    <div id="prism-seam"></div>
    <div id="preview-column">
      <div class="r-col-label">02 — Preview</div>
      <div id="preview-host"></div>
    </div>
  </div>
</div>
<div id="counter-pill">
  <span class="dots"><span class="d"></span><span class="d"></span><span class="d"></span><span class="d"></span><span class="d"></span></span>
  <span class="count">0</span>
  <span>단어</span>
  <span style="color: var(--faint)">·</span>
  <span class="typing">작성 중…</span>
</div>
<div id="theme-popover">
  <div class="caption">테마 — ⌘⇧L 로 순환</div>
  <div class="row" data-key="night"><span class="mini-swatch" style="background:#8b94ff"></span><span class="label">Night</span><span class="check">✓</span></div>
  <div class="row" data-key="day"><span class="mini-swatch" style="background:#5b5cf0"></span><span class="label">Day</span><span class="check">✓</span></div>
  <div class="row" data-key="sepia"><span class="mini-swatch" style="background:#b5651d"></span><span class="label">Sepia</span><span class="check">✓</span></div>
  <div class="row" data-key="forest"><span class="mini-swatch" style="background:#58c896"></span><span class="label">Forest</span><span class="check">✓</span></div>
  <div class="row" data-key="paper"><span class="mini-swatch" style="background:#d2543e"></span><span class="label">손글씨</span><span class="check">✓</span></div>
</div>

<script src="cm.bundle.js"></script>
<script src="vendor/marked.min.js"></script>
<script src="vendor/highlight.min.js"></script>
<script src="vendor/mermaid.min.js"></script>
<script>
  try {
    if (window.mermaid && typeof window.mermaid.initialize === "function") {
      window.mermaid.initialize({ startOnLoad: false, securityLevel: "loose", theme: "default" });
    }
  } catch (e) {
    window.webkit?.messageHandlers?.consoleLog?.postMessage("[init] mermaid init error: " + e.message);
  }
</script>
<script>
  CM.bootEditor(document.getElementById("editor-host"));
</script>
</body>
</html>
