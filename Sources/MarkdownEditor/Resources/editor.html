<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<style>
/* === Bundled fonts === */
@font-face { font-family:"Gaegu"; src:url("vendor/Gaegu-Regular.ttf") format("truetype"); font-weight:400; font-display:swap; }
@font-face { font-family:"Gaegu"; src:url("vendor/Gaegu-Bold.ttf") format("truetype"); font-weight:700; font-display:swap; }
@font-face { font-family:"Nanum Pen Script"; src:url("vendor/NanumPenScript-Regular.ttf") format("truetype"); font-weight:400; font-display:swap; }
@font-face { font-family:"Gowun Batang"; src:url("vendor/GowunBatang-Regular.ttf") format("truetype"); font-weight:400 700; font-display:swap; }
@font-face { font-family:"Nanum Myeongjo"; src:url("vendor/NanumMyeongjo-Regular.ttf") format("truetype"); font-weight:400 700; font-display:swap; }
@font-face { font-family:"Nanum Myeongjo"; src:url("vendor/NanumMyeongjo-ExtraBold.ttf") format("truetype"); font-weight:800; font-display:swap; }

/* === 달필 (Dalpil) tokens — 따뜻한 종이/잉크. 단일 팔레트. === */
:root {
  --paper:#f6f0e2; --paper-edge:#efe7d4;
  --rule:#d3cdbb; --margin:#d98c84;
  --ink:#34302a; --ink-soft:#6f685c;
  --page:#fbfaf6; --page-ink:#211f1b; --page-soft:#7c7468;
  --accent:#b56a4f;
  --seam-top:#d8cdb4; --seam-bot:#cdbf9f;
  --edge-line:#e2d8c2;

  /* 사용자 선택 (Swift 브릿지가 갱신) */
  --hand:"Gaegu";              /* 손글씨 폰트 — setFontFamily가 덮어씀 */
  --serif:"Nanum Myeongjo";    /* 조판 세리프 */
  --mono:"SF Mono", ui-monospace, Menlo, monospace;
  --ui:"Gowun Batang", serif;

  /* 손글씨 본문 스케일 (프로토타입 그대로 — 26 / line 38, 줄노트 ruling과 일치) */
  --hand-size:26px; --hand-line:38px;

  /* 코드 카드 토큰 */
  --code-bg:#2c2a26; --code-ink:#e9e3d6;
  --tok-k:#e0936b; --tok-s:#9ec98a; --tok-c:#8a8273; --tok-n:#d8b96b;
}

* { box-sizing:border-box; }
html, body {
  margin:0; padding:0; height:100%; width:100%;
  background:var(--paper); color:var(--ink);
  font-family:var(--ui); font-size:13px;
  -webkit-font-smoothing:antialiased;
}

#refract-shell {
  display:grid;
  grid-template-rows: 48px 1fr 34px;
  height:100vh; overflow:hidden;
  background:var(--paper);
}

/* === 통합 타이틀바 헤더 === */
/* fullSizeContentView에서 traffic light가 헤더 위에 overlay → 좌측 78pt 비움, top 0. */
#refract-header {
  display:flex; align-items:center; gap:14px;
  padding:0 18px 0 78px;
  background:var(--paper-edge);
  border-bottom:1px solid var(--edge-line);
  position:relative; z-index:4;
  -webkit-app-region:drag; user-select:none;
}
#refract-header > * { -webkit-app-region:no-drag; }
.r-brand { display:flex; align-items:center; gap:10px; }
.r-nib { width:26px; height:26px; flex:0 0 26px; }
.r-wordmark {
  font-family:"Nanum Myeongjo", serif; font-weight:800;
  font-size:17px; letter-spacing:.5px; color:#2c2823;
}
.r-divider { width:1px; height:18px; background:#dccfb6; }
.r-filename {
  font-family:var(--hand), cursive; font-size:19px; color:var(--ink-soft);
  max-width:360px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;
}
.r-dirty-dot {
  width:7px; height:7px; border-radius:50%; background:var(--accent);
  margin-left:1px; display:none;
}
body[data-dirty="1"] .r-dirty-dot { display:inline-block; }
.r-spacer { flex:1; min-width:8px; }

/* Tweaks 버튼 */
.r-tweaks-button {
  display:inline-flex; align-items:center; gap:7px;
  background:transparent; border:1px solid #e0d6bf; border-radius:8px;
  padding:0 10px; height:28px; color:var(--ink-soft);
  font-family:var(--ui); font-size:13px; cursor:pointer;
}
.r-tweaks-button:hover { background:#f0e8d6; color:var(--ink); }
.r-tweaks-button svg { display:block; }

/* 모드 세그먼트 — 노트 / 나란히 / 책 */
.r-view-toggle {
  display:inline-flex; gap:2px; background:#e7ddc8;
  border-radius:9px; padding:3px;
}
.r-view-toggle button {
  background:transparent; border:0;
  font-family:var(--hand), cursive; font-size:16px; line-height:1;
  color:var(--ink-soft); padding:6px 14px; border-radius:7px;
  cursor:pointer; white-space:nowrap;
}
.r-view-toggle button.active {
  background:var(--paper); color:var(--ink);
  box-shadow:0 1px 3px rgba(0,0,0,.08);
}

/* === Body === */
#refract-body {
  position:relative; display:grid;
  grid-template-columns: 1fr 1px 1fr;
  height:100%; overflow:hidden;
}
/* note/book에서 두 열을 display:none 하면 남은 한 열이 grid 첫 트랙에 auto-place되므로,
   트랙을 단일 1fr로 줄여 남은 패널이 항상 전체 너비를 받게 한다(책 모드 빈 화면 버그 수정). */
#refract-shell[data-view-mode="note"] #refract-body { grid-template-columns: 1fr; }
#refract-shell[data-view-mode="note"] #preview-column,
#refract-shell[data-view-mode="note"] #prism-seam { display:none; }
#refract-shell[data-view-mode="book"] #refract-body { grid-template-columns: 1fr; }
#refract-shell[data-view-mode="book"] #source-column,
#refract-shell[data-view-mode="book"] #prism-seam { display:none; }

#source-column, #preview-column {
  position:relative; height:100%; overflow:hidden;
  display:flex; flex-direction:column;
}

/* === 왼쪽: 손글씨 노트 종이 === */
#source-column { background:var(--paper); }
#source-column[data-paper="ruled"] {
  background:repeating-linear-gradient(var(--paper) 0 37px, var(--rule) 37px 38px);
  background-position:0 14px;
}
#source-column[data-paper="grid"] {
  background-image:
    repeating-linear-gradient(var(--paper) 0 37px, var(--rule) 37px 38px),
    repeating-linear-gradient(90deg, transparent 0 37px, var(--rule) 37px 38px);
  background-position:0 14px, 0 0;
}
#source-column[data-paper="dot"] {
  background-image:radial-gradient(var(--rule) 1.4px, transparent 1.6px);
  background-size:26px 26px; background-position:10px 18px;
}
#source-column[data-paper="plain"] { background:var(--paper); }
/* 빨간 마진선 — 줄/모눈에서만 */
#source-column::before {
  content:""; position:absolute; top:0; bottom:0; left:74px; width:2px;
  background:var(--margin); opacity:.55; pointer-events:none; z-index:3;
  transition:opacity .2s;
}
#source-column[data-paper="plain"]::before,
#source-column[data-paper="dot"]::before { opacity:0; }

#editor-host { flex:1; min-height:0; overflow:hidden; }

/* === 가운데 솔기 + 잉크 번짐 === */
#prism-seam {
  position:relative;
  background:linear-gradient(var(--seam-top), var(--seam-bot));
}
#prism-seam::after {
  content:""; position:absolute; top:0; bottom:0; left:-28px; width:56px;
  background:radial-gradient(ellipse 60% 40% at 50% 50%, rgba(181,106,79,.10), transparent 70%);
  pointer-events:none;
}

/* === 오른쪽: 조판된 책 === */
#preview-column { background:var(--page); }
#preview-host {
  flex:1; min-height:0; overflow:auto;
  display:flex; justify-content:center;   /* split·book 모두 책 본문 가운데 정렬 */
}
.sheet {
  width:100%; max-width:560px; padding:54px 56px 80px;
  color:var(--page-ink); font-family:var(--serif), serif;
}
#refract-shell[data-view-mode="book"] .sheet { max-width:680px; }

.sheet h1 { font-family:var(--serif),serif; font-weight:800; font-size:31px; line-height:1.25; margin:0 0 6px; letter-spacing:-.2px; }
.sheet h2 { font-family:var(--serif),serif; font-weight:800; font-size:22px; margin:30px 0 12px; letter-spacing:-.2px; }
.sheet h3 { font-family:var(--serif),serif; font-weight:700; font-size:18px; margin:24px 0 10px; color:#3b362e; }
.sheet h4 { font-family:var(--serif),serif; font-weight:700; font-size:16px; margin:20px 0 8px; color:#3b362e; }
.sheet h5, .sheet h6 { font-family:var(--serif),serif; font-weight:700; font-size:14px; margin:16px 0 6px; color:var(--page-soft); }
.sheet p { font-size:17px; line-height:1.85; margin:0 0 18px; text-wrap:pretty; }
.sheet strong { font-weight:800; }
.sheet em { color:var(--accent); font-style:italic; }
.sheet del { color:var(--page-soft); }
.sheet a { color:var(--accent); text-decoration:none; border-bottom:1px solid rgba(181,106,79,.4); }
.sheet blockquote {
  margin:0 0 18px; padding:2px 0 2px 20px; border-left:3px solid var(--accent);
  color:#5a5247; font-style:italic; font-size:17px; line-height:1.8;
}
.sheet ul, .sheet ol { margin:0 0 18px; padding-left:24px; }
.sheet li { font-size:17px; line-height:1.8; margin-bottom:6px; }
.sheet li::marker { color:var(--accent); }
.sheet ul ul, .sheet ol ol, .sheet ul ol, .sheet ol ul { margin:6px 0 4px; }
/* Task list — marked GFM <input type=checkbox> → 그린/테라코타 박스 */
.sheet li.task-list-item { list-style:none; position:relative; padding-left:26px; }
.sheet li.task-list-item::marker { content:none; }
.sheet li.task-list-item input[type="checkbox"] {
  position:absolute; left:0; top:5px; margin:0; width:16px; height:16px;
  appearance:none; -webkit-appearance:none;
  border:1.5px solid #b9b0a0; border-radius:4px; background:transparent; cursor:default;
}
.sheet li.task-list-item input[type="checkbox"]:checked { background:var(--accent); border-color:var(--accent); }
.sheet li.task-list-item input[type="checkbox"]:checked::after {
  content:""; position:absolute; left:5px; top:1px; width:4px; height:9px;
  border:solid #fff; border-width:0 2px 2px 0; transform:rotate(40deg);
}
.sheet li.task-list-item.checked { color:var(--page-soft); text-decoration:line-through; text-decoration-color:#c9c0b0; }
.sheet hr { border:0; height:1px; background:#e6ddcd; margin:28px 0; }

/* 인라인 코드 */
.sheet code {
  font-family:var(--mono); font-size:14px;
  background:#efeadf; color:#9d5236; padding:2px 6px; border-radius:5px;
}
/* 코드 카드 — 다크. 언어 라벨 세리프 uppercase. 줄번호/copy 없음. */
.sheet pre {
  margin:0 0 20px; background:var(--code-bg); border-radius:10px; overflow:hidden;
  box-shadow:0 2px 12px rgba(40,32,20,.14); border:0;
}
.sheet pre > .code-header { padding:0; background:transparent; border:0; }
.sheet pre > .code-header .lang-chip {
  display:block; background:transparent; color:#b6ab97; padding:8px 16px 0;
  font-family:var(--serif), serif; font-size:11px; font-weight:700;
  letter-spacing:.6px; text-transform:uppercase;
}
.sheet pre code {
  display:block; font-family:var(--mono); font-size:13.5px; line-height:1.7;
  color:var(--code-ink); background:transparent; padding:8px 16px 16px;
  white-space:pre; overflow-x:auto; border-radius:0;
}
/* highlight.js → 달필 코드 토큰색 */
.sheet pre code .hljs-keyword, .sheet pre code .hljs-built_in,
.sheet pre code .hljs-literal { color:var(--tok-k); }
.sheet pre code .hljs-string, .sheet pre code .hljs-attr,
.sheet pre code .hljs-meta-string { color:var(--tok-s); }
.sheet pre code .hljs-comment, .sheet pre code .hljs-quote { color:var(--tok-c); font-style:italic; }
.sheet pre code .hljs-number { color:var(--tok-n); }
.sheet pre code .hljs-title, .sheet pre code .hljs-name,
.sheet pre code .hljs-type, .sheet pre code .hljs-function .hljs-title { color:var(--code-ink); }
/* 표 — 헤더 밑줄, 세로줄 없음 */
.sheet table { border-collapse:collapse; width:100%; margin:0 0 20px; font-size:15px; }
.sheet th, .sheet td { border-bottom:1px solid #e6ddcd; padding:9px 12px; text-align:left; }
.sheet th { font-weight:800; color:#3b362e; border-bottom:2px solid #d8cdb8; }
.sheet tr:last-child td { border-bottom:0; }
.sheet img { max-width:100%; height:auto; border-radius:8px; margin:8px 0; }
.sheet .img-placeholder {
  height:84px; border:1px solid #e4d9c1; border-radius:10px; margin:8px 0;
  background:repeating-linear-gradient(135deg, rgba(120,104,78,.05) 0 10px, transparent 10px 20px);
  display:flex; flex-direction:column; align-items:center; justify-content:center;
  font-family:var(--mono);
}
.sheet .img-placeholder .ph-body { font-size:12px; color:var(--page-soft); }
.sheet .img-placeholder .ph-caption { font-size:11px; color:var(--page-soft); opacity:.7; margin-top:4px; }
/* Mermaid */
.sheet pre.mermaid-pre { background:var(--code-bg); }
.sheet pre.mermaid-pre .mermaid-host { display:flex; justify-content:center; padding:14px; min-height:80px; }
.sheet pre.mermaid-pre .mermaid-host svg { max-width:100%; height:auto; }

/* === SOURCE — CodeMirror 손글씨 테마 === */
.cm-editor { height:100%; background:transparent !important; color:var(--ink); }
.cm-editor.cm-focused { outline:none; }
.cm-scroller {
  background:transparent !important;
  font-family:var(--hand), cursive;
  font-size:var(--hand-size); line-height:var(--hand-line);
}
.cm-content {
  padding:18px 40px 60px 96px;
  caret-color:var(--accent); background:transparent !important;
}
.cm-gutters { display:none !important; }
.cm-activeLine { background:transparent; }
.cm-activeLineGutter { background:transparent; }
/* 커서 — 테라코타 블링크 */
.cm-cursor, .cm-editor.cm-focused .cm-cursor {
  border-left:2px solid var(--accent);
  animation:dpBlink 1s steps(1) infinite;
}
@keyframes dpBlink { 50% { opacity:0; } }
.cm-editor .cm-selectionBackground,
.cm-editor.cm-focused .cm-selectionBackground {
  background:rgba(181,106,79,.18) !important;
}

/* SOURCE 마크다운 마커 — accent, 노출은 data-tok로 */
.cm-content .tok-meta, .cm-content .cm-md-marker,
.cm-content .tok-processingInstruction,
.cm-content .tok-list, .cm-content .md-list-mark,
.cm-content .tok-quote, .cm-content .tok-url { color:var(--accent); opacity:.7; }
body[data-tok="faint"] .cm-content .tok-meta,
body[data-tok="faint"] .cm-content .cm-md-marker,
body[data-tok="faint"] .cm-content .tok-processingInstruction,
body[data-tok="faint"] .cm-content .tok-list,
body[data-tok="faint"] .cm-content .md-list-mark,
body[data-tok="faint"] .cm-content .tok-quote,
body[data-tok="faint"] .cm-content .tok-url { opacity:.22; }
body[data-tok="hide"] .cm-content .tok-meta,
body[data-tok="hide"] .cm-content .cm-md-marker,
body[data-tok="hide"] .cm-content .tok-processingInstruction,
body[data-tok="hide"] .cm-content .tok-list,
body[data-tok="hide"] .cm-content .md-list-mark,
body[data-tok="hide"] .cm-content .tok-quote,
body[data-tok="hide"] .cm-content .tok-url { opacity:0; }
/* heading text는 잉크, 굵게 */
.cm-content .tok-heading, .cm-content .tok-heading1, .cm-content .tok-heading2,
.cm-content .tok-heading3, .cm-content .tok-heading4,
.cm-content .tok-heading5, .cm-content .tok-heading6 { color:var(--ink); font-weight:700; }
.cm-content .tok-heading1 { font-size:1.30em; }
.cm-content .tok-heading2 { font-size:1.14em; }
.cm-content .tok-heading3 { font-size:1.0em; }
.cm-content .tok-strong { color:var(--ink); font-weight:700; }
.cm-content .tok-emphasis { color:var(--ink); font-style:italic; }
.cm-content .tok-link { color:var(--accent); }
.cm-content .tok-monospace, .cm-content .tok-inlineCode,
.cm-content .cm-inline-code { font-family:var(--mono); color:#5b5448; }

/* 왼쪽 코드펜스·표 → "붙여둔" 모노 카드 (CodeMirror line decoration) */
.cm-line.cm-dalpil-card {
  font-family:var(--mono); font-size:15px; line-height:1.65; color:#5b5448;
  background:rgba(120,104,78,.07);
  border-left:1px solid rgba(120,104,78,.18);
  border-right:1px solid rgba(120,104,78,.18);
  padding-left:14px; padding-right:14px;
}
.cm-line.cm-dalpil-card-first {
  border-top:1px solid rgba(120,104,78,.18);
  border-top-left-radius:8px; border-top-right-radius:8px;
  margin-top:6px; padding-top:6px;
}
.cm-line.cm-dalpil-card-last {
  border-bottom:1px solid rgba(120,104,78,.18);
  border-bottom-left-radius:8px; border-bottom-right-radius:8px;
  margin-bottom:6px; padding-bottom:6px;
}
.cm-line.cm-dalpil-card .tok-meta,
.cm-line.cm-dalpil-card .cm-md-marker { color:var(--accent); opacity:.6; }

/* 검색 패널 */
.cm-panels.cm-panels-top { background:var(--paper-edge); border-bottom:1px solid var(--edge-line); color:var(--ink); }
.cm-panel.cm-search { padding:8px 14px; display:flex; gap:6px; align-items:center; font-size:12px; font-family:var(--ui); }
.cm-search .cm-textfield { background:var(--paper); color:var(--ink); border:1px solid var(--edge-line); border-radius:5px; padding:3px 9px; outline:none; min-width:180px; height:26px; }
.cm-search .cm-textfield:focus { border-color:var(--accent); }
.cm-search .cm-button { background:transparent; border:1px solid var(--edge-line); border-radius:5px; padding:3px 10px; color:var(--ink); cursor:pointer; height:26px; }
.cm-search .cm-button:hover { background:#f0e8d6; }
.cm-searchMatch { background:rgba(181,106,79,.25); border-radius:2px; }
.cm-searchMatch-selected { background:var(--accent); color:#fff; }

/* === 상태바 === */
#status-bar {
  display:flex; align-items:center; gap:16px; padding:0 20px;
  background:var(--paper-edge); border-top:1px solid var(--edge-line);
  font-family:var(--hand), cursive; font-size:16px; color:var(--ink-soft);
  user-select:none;
}
#status-bar .sb-right { margin-left:auto; display:flex; gap:18px; align-items:center; }
#status-bar .sb-sep { color:#c9bfa6; opacity:.7; }
.ink-dots { display:flex; gap:4px; align-items:center; }
.ink-dots i { width:6px; height:6px; border-radius:50%; background:var(--accent); opacity:.35; }
.ink-dots i.on { opacity:.9; }

/* === Tweaks popover === */
#tweaks-popover {
  position:fixed; top:52px; right:18px; width:248px; z-index:100;
  background:#fbf7ec; border:1px solid var(--edge-line); border-radius:14px;
  box-shadow:0 18px 50px rgba(60,48,30,.22);
  padding:14px 16px 16px; display:none;
  font-family:var(--ui); color:var(--ink);
}
#tweaks-popover.open { display:block; }
#tweaks-popover .tw-head { display:flex; align-items:center; justify-content:space-between; margin-bottom:6px; }
#tweaks-popover .tw-head b { font-family:"Nanum Myeongjo", serif; font-weight:800; font-size:15px; }
#tweaks-popover .grp { margin-top:14px; }
#tweaks-popover .lbl { font-weight:700; font-size:12px; letter-spacing:.3px; color:var(--ink-soft); margin-bottom:6px; }
#tweaks-popover .seg { display:flex; gap:3px; background:#efe6d2; border-radius:9px; padding:3px; }
#tweaks-popover .seg button {
  flex:1; border:0; background:transparent; cursor:pointer;
  font-family:var(--ui); font-size:13px; color:var(--ink-soft);
  padding:6px 4px; border-radius:6px; white-space:nowrap;
}
#tweaks-popover .seg button.on { background:#fff; color:var(--ink); box-shadow:0 1px 2px rgba(0,0,0,.08); }

/* === 빈 문서 환영 화면 === */
#welcome {
  position:absolute; inset:0; z-index:6;
  display:none; align-items:center; justify-content:center;
  background:transparent; pointer-events:none;  /* 에디터/커서가 비치도록 투명 */
}
#refract-body.empty #welcome { display:flex; }
#welcome .wcard { text-align:center; max-width:430px; padding:0 24px; }
#welcome .wnib { width:46px; height:46px; opacity:.85; margin-bottom:14px; }
#welcome h2 { font-family:"Nanum Myeongjo", serif; font-weight:800; font-size:26px; color:#2c2823; margin:0 0 12px; }
#welcome p { font-family:var(--hand), cursive; font-size:21px; line-height:1.6; color:var(--ink-soft); margin:0 0 26px; }
#welcome .chips { display:flex; flex-wrap:wrap; gap:8px; justify-content:center; margin-bottom:26px; }
#welcome .chips span {
  display:inline-flex; align-items:center; gap:7px;
  font-family:var(--ui); font-size:13px; color:var(--ink-soft);
  background:#efe7d4; border:1px solid #e4d9c1; border-radius:20px; padding:6px 13px; white-space:nowrap;
}
#welcome .chips b { font-family:var(--mono); color:var(--accent); font-weight:700; }

}
