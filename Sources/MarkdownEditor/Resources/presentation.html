<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Presentation</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/highlight.js@11/styles/github.min.css">
<style>
:root { color-scheme: light; }
* { box-sizing: border-box; }
html, body {
  margin: 0; padding: 0;
  background: #ffffff;
  color: #1c1c1e;
  font-family: -apple-system, "SF Pro Text", "Helvetica Neue", "Apple SD Gothic Neo", sans-serif;
  font-size: 16px;
  line-height: 1.7;
  letter-spacing: -0.005em;
}
article {
  max-width: 820px;
  margin: 0 auto;
  padding: 80px 60px 140px;
}
article h1 { font-size: 2.4em; font-weight: 700; letter-spacing: -0.02em; margin: 0.8em 0 0.4em; }
article h2 { font-size: 1.8em; font-weight: 700; letter-spacing: -0.015em; margin: 1.4em 0 0.4em; }
article h3 { font-size: 1.4em; font-weight: 600; margin: 1.2em 0 0.3em; }
article h4 { font-size: 1.15em; font-weight: 600; margin: 1em 0 0.3em; }
article p { margin: 0.6em 0; }
article a { color: #0066cc; text-decoration: none; border-bottom: 1px solid rgba(0,102,204,0.3); }
article ul, article ol { padding-left: 1.5em; margin: 0.6em 0; }
article li { margin: 0.2em 0; }
article li::marker { color: #34a89c; }
article blockquote {
  margin: 1em 0; padding: 0.4em 1em;
  border-left: 3px solid #c8c8cd; color: #6e6e73; font-style: italic;
}
article hr { border: none; border-top: 1px solid #e5e5ea; margin: 2em 0; }
article code {
  font-family: "JetBrains Mono", ui-monospace, "SF Mono", monospace;
  font-size: 0.88em;
  background: #f3f3f5;
  color: #c71f3a;
  padding: 0.1em 0.35em;
  border-radius: 3px;
}
article pre {
  background: #f3f3f5;
  border-radius: 6px;
  padding: 14px 18px;
  overflow-x: auto;
  margin: 1em 0;
}
article pre code {
  background: none;
  color: inherit;
  padding: 0;
  font-size: 0.85em;
  line-height: 1.55;
}
article img { max-width: 100%; border-radius: 6px; }
article table { border-collapse: collapse; margin: 1em 0; }
article th, article td { border: 1px solid #e5e5ea; padding: 6px 12px; }
article th { background: #f5f5f7; font-weight: 600; }
</style>
</head>
<body>
<article id="content"></article>
<script src="https://cdn.jsdelivr.net/npm/marked@13/marked.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/highlight.js@11/lib/core.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/highlight.js@11/lib/common.min.js"></script>
<script>
function relay(...args) {
  try {
    window.webkit.messageHandlers.consoleLog.postMessage("[present] " + args.join(" "));
  } catch (e) {}
}
window.addEventListener("error", e => relay("error:", e.message, e.filename, e.lineno));

// ESC를 capture phase에서 가로채 Swift로 close 요청
window.addEventListener("keydown", (e) => {
  if (e.key === "Escape") {
    e.preventDefault();
    e.stopImmediatePropagation();
    try { window.webkit.messageHandlers.closeRequest.postMessage(null); } catch (err) {}
  }
}, true);

window.appBridge = {
  setMarkdown(md) {
    relay("setMarkdown len=" + md.length);
    if (typeof marked === "undefined") { relay("marked not loaded"); return; }
    const html = marked.parse(md, { gfm: true, breaks: false });
    document.getElementById("content").innerHTML = html;
    if (typeof hljs !== "undefined") {
      document.querySelectorAll("pre code").forEach(b => hljs.highlightElement(b));
    }
  }
};
relay("loaded, marked=" + (typeof marked));
</script>
</body>
</html>
