<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Presentation</title>
<link rel="stylesheet" href="vendor/highlight-github.min.css">
<style>
/* 로컬 JetBrains Mono — Google Fonts CDN 없이 동작 (회사 네트워크 등 차단 환경 대응) */
@font-face {
  font-family: "JetBrains Mono";
  src: url("vendor/JetBrainsMono-Regular.woff2") format("woff2");
  font-weight: 400; font-style: normal; font-display: swap;
}
@font-face {
  font-family: "JetBrains Mono";
  src: url("vendor/JetBrainsMono-Medium.woff2") format("woff2");
  font-weight: 500; font-style: normal; font-display: swap;
}
@font-face {
  font-family: "JetBrains Mono";
  src: url("vendor/JetBrainsMono-SemiBold.woff2") format("woff2");
  font-weight: 600; font-style: normal; font-display: swap;
}
/* 발표 모드 디자인 시스템 — 모노톤 + 파란 accent 1개.
   메인 에디터(mock A)와 같은 톤이지만 발표용으로 사이즈/여백 확장. */
:root {
  color-scheme: light;
  --bg: #ffffff;
  --fg: #1c1c1e;
  --heading: #0d0d12;
  --secondary: #6e6e73;
  --muted: #a0a0a5;
  --hairline: #ececef;
  --accent: #0066cc;
  --code-bg: #f5f5f7;
  --code-border: #ececef;
}
* { box-sizing: border-box; }
html, body {
  margin: 0; padding: 0;
  background: var(--bg);
  color: var(--fg);
  font-family: -apple-system, "SF Pro Text", "Helvetica Neue", "Apple SD Gothic Neo", sans-serif;
  font-size: 17px;
  line-height: 1.7;
  letter-spacing: -0.005em;
}
article {
  max-width: min(1080px, 90vw);
  margin: 0 auto;
  padding: 80px 60px 140px;
}

/* Headings — 진한 검정 단색, 깔끔한 hierarchy */
article h1, article h2, article h3, article h4 { color: var(--heading); }
article h1 {
  font-size: 2.6em; font-weight: 700; letter-spacing: -0.022em;
  margin: 0.4em 0 0.5em;
}
article h2 {
  font-size: 1.85em; font-weight: 700; letter-spacing: -0.018em;
  margin: 1.6em 0 0.5em; padding-bottom: 0.3em;
  border-bottom: 1px solid var(--hairline);
}
article h3 { font-size: 1.35em; font-weight: 600; margin: 1.2em 0 0.3em; }
article h4 { font-size: 1.1em; font-weight: 600; margin: 1em 0 0.3em; }
article p { margin: 0.6em 0; }
article strong { color: var(--heading); font-weight: 700; }
article em { font-style: italic; }

/* Links — 단일 accent, 절제된 underline */
article a {
  color: var(--accent);
  text-decoration: none;
  border-bottom: 1px solid rgba(0, 102, 204, 0.35);
  transition: border-color 0.12s ease;
}
article a:hover { border-bottom-color: var(--accent); }

/* Lists — marker는 본문 톤 (튀지 않게), accent는 링크 전용 */
article ul, article ol { padding-left: 1.5em; margin: 0.6em 0; }
article li { margin: 0.25em 0; }
article ul li::marker { color: var(--muted); }
article ol li::marker { color: var(--muted); font-weight: 500; }

/* Blockquote — italic 제거, 좌측 accent line */
article blockquote {
  margin: 1.2em 0;
  padding: 0.4em 0 0.4em 1em;
  border-left: 3px solid var(--accent);
  color: var(--secondary);
}
article blockquote p { margin: 0.3em 0; }

article hr {
  border: none;
  border-top: 1px solid var(--hairline);
  margin: 2.2em 0;
}

/* Inline code — 본문 톤, 옅은 배경 (분홍 빠짐) */
article code {
  font-family: "JetBrains Mono", ui-monospace, "SF Mono", monospace;
  font-size: 0.86em;
  background: var(--code-bg);
  color: var(--fg);
  padding: 0.12em 0.4em;
  border-radius: 4px;
}

/* Code block — 본문보다 넓게, 모서리 둥글게, 가는 테두리로 본문과 자연스러운 경계 */
article pre {
  background: var(--code-bg);
  border: 1px solid var(--code-border);
  border-radius: 8px;
  padding: 16px 20px;
  overflow-x: auto;
  margin: 1.2em -40px;
  max-width: calc(100% + 80px);
}
article pre code {
  background: none;
  color: inherit;
  padding: 0;
  font-size: 0.85em;
  line-height: 1.6;
}

/* Image — 본문에 자연스럽게, 옅은 그림자 */
article img {
  max-width: 100%;
  border-radius: 8px;
  box-shadow: 0 1px 4px rgba(0, 0, 0, 0.08);
  margin: 0.4em 0;
}

/* Table — 라인 색 통일 */
article table {
  border-collapse: collapse;
  margin: 1em 0;
  width: 100%;
}
article th, article td {
  border: 1px solid var(--hairline);
  padding: 8px 14px;
  text-align: left;
}
article th {
  background: var(--code-bg);
  font-weight: 600;
  color: var(--heading);
}

/* Task list (GFM checkbox) */
article input[type="checkbox"] {
  margin-right: 0.4em;
  accent-color: var(--accent);
}
</style>
</head>
<body>
<article id="content"></article>
<script src="vendor/marked.min.js"></script>
<script src="vendor/highlight.min.js"></script>
<script>
function relay(...args) {
  try {
    window.webkit.messageHandlers.consoleLog.postMessage("[present] " + args.join(" "));
  } catch (e) {}
}
window.addEventListener("error", e => relay("error:", e.message, e.filename, e.lineno));

// ESC를 capture phase에서 가로채 Swift로 close 요청
window.addEventListener("keydown", (e) => {
  if (e.key === "Escape") {
    e.preventDefault();
    e.stopImmediatePropagation();
    try { window.webkit.messageHandlers.closeRequest.postMessage(null); } catch (err) {}
  }
}, true);

// 마크다운 안 ![](path) 의 path가 상대 경로면 docFolderURL 기준 file:// URL로 치환.
// http(s)://, file://, data: 는 그대로.
function absolutize(src, baseURL) {
  if (!src) return src;
  if (/^(https?:|file:|data:)/i.test(src)) return src;
  if (!baseURL) return src;
  const looksEncoded = /%[0-9A-Fa-f]{2}/.test(src);
  const encoded = looksEncoded ? src : encodeURI(src);
  if (encoded.startsWith("/")) return "file://" + encoded;
  return baseURL + encoded;
}

// CommonMark는 라인 시작 4 spaces를 indented code block으로 보지만, 우리 노트는 그냥
// 들여쓰기 의도로 4 spaces를 쓰는 경우가 많다 (heading 다음 list 등). 그게 회색 박스 +
// hljs syntax 색까지 들어가 어색하므로 indented code 처리만 비활성화. 펜스(```) 코드는 유지.
if (typeof marked !== "undefined") {
  marked.use({
    tokenizer: {
      code() { return undefined; }  // indented code block 비활성화 → paragraph로 fallback
    }
  });
}

window.appBridge = {
  setMarkdown(md, baseURL) {
    relay("setMarkdown len=" + md.length + " base=" + (baseURL || "(none)"));
    if (typeof marked === "undefined") { relay("marked not loaded"); return; }
    // 1) 이미지 src를 baseURL 기준 절대 file:// URL로
    let rewritten = md.replace(/(!\[[^\]]*\])\(([^)\s]+)((?:\s+"[^"]*")?\))/g,
      (_, head, src, tail) => `${head}(${absolutize(src, baseURL)}${tail}`);
    // 2) 사용자 노트는 list를 4 spaces 또는 1 tab 단위로 들여쓰는 경향. CommonMark는
    //    nested list가 2 spaces 단위라 list로 인식 못 함. tab → 4 spaces로 expand 후
    //    list 라인의 indent에서 4 spaces 빼서 정상화.
    rewritten = rewritten.split("\n").map(line => {
      const expanded = line.replace(/^[\t ]+/, (lead) => lead.replace(/\t/g, "    "));
      const m = expanded.match(/^( {4,})([-*+]|\d+\.)\s/);
      if (!m) return expanded;
      const newIndent = " ".repeat(m[1].length - 4);
      return newIndent + expanded.slice(m[1].length);
    }).join("\n");
    const html = marked.parse(rewritten, { gfm: true, breaks: false });
    document.getElementById("content").innerHTML = html;
    // 2) HTML img 태그 (![]가 아닌 <img src>) 가 있을 수 있으니 후처리로 한 번 더
    document.querySelectorAll("article img").forEach(img => {
      const cur = img.getAttribute("src") || "";
      if (cur && !/^(https?:|file:|data:)/i.test(cur)) {
        img.src = absolutize(cur, baseURL);
      }
    });
    if (typeof hljs !== "undefined") {
      relay("hljs version=" + (hljs.versionString || "?"));
      document.querySelectorAll("pre code").forEach(b => {
        // setMarkdown이 재호출되는 경우 이전 highlight 흔적 제거
        b.removeAttribute("data-highlighted");
        hljs.highlightElement(b);
      });
    } else {
      relay("hljs UNDEFINED");
    }
  }
};
relay("loaded, marked=" + (typeof marked));
</script>
</body>
</html>
